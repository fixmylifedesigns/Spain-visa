name: Deploy hub to GitHub Pages

on:
  push:
    branches: [main, dev]
  schedule:
    - cron: "0 3 * * *" # daily: refresh the nearby-places cache
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-dev
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - name: Pre-fetch nearby places
        run: node scripts/build-places.mjs
        env:
          PLACES_PREV_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data/places.json
      - name: Build static hub
        run: |
          npm run build
          touch out/.nojekyll
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          NEXT_PUBLIC_SHEETS_URL: ${{ vars.SHEETS_WEBAPP_URL }}
      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          publish_branch: gh-pages
          force_orphan: true
